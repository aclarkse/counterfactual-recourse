[project]
name = "causal-recourse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "nflows==0.14",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0,<3.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    # Optimization
    "pyomo>=6.7.0",
    "highspy>=1.7.0",
    # Config & tracking
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.16.0",
    # Causal baselines
    "dice-ml>=0.11",
    "dowhy>=0.11",
    # Notebooks & visualization
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    # Utilities
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "folktables>=0.0.12",
]

[tool.setuptools.packages.find]
include = ["data*", "flows*", "outcome*", "evaluation*"]

[tool.uv]
# PyTorch is excluded here because the install URL depends on your CUDA version.
# It is installed separately in the setup instructions below.

[tool.uv.sources]
# Pin PyTorch to a CUDA build. cu128 ships sm_120 kernels required by
# Blackwell GPUs (RTX 50-series); older indices (cu126) do not.
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
