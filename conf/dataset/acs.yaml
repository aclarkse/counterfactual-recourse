name: acs

loader:
  module: data.acs
  fn: load_acs_income
  kwargs:
    year: 2018
    states: [CA]
    threshold: 50000

sfm:
  sensitive: [SEX]
  confounders: [AGEP, POBP_US]
  mediators_disc: [SCHL_GRP, OCCP_GRP]
  mediators_cont: [WKHP]
  outcome: income

# Clip all Wc columns before QuantileTransformer (null = no clip)
wc_clip: [1.0, 60.0]

flow:
  hidden_dim: 64
  n_layers: 2
  embed_dim: 4
  hidden_features: 64
  n_flow_layers: 4
  n_blocks: 2
  num_bins: 8
  tail_bound: 3.0
  batch_size: 256
  max_epochs: 100
  lr: 0.001
  patience: 10

outcome:
  # Preprocessing per column in [X | Z | Wd | Wc_natural] order
  col_types:
    X: [passthrough]              # SEX
    Z: [scale, passthrough]       # AGEP→scale, POBP_US→passthrough
    Wd: [ohe, ohe]                # SCHL_GRP, OCCP_GRP
    Wc: [scale]                   # WKHP natural units
  models:
    - name: "Logistic Reg."
      type: logreg
      C: 1.0
      max_iter: 1000
    - name: "MLP (64--32)"
      type: mlp
      hidden_layer_sizes: [64, 32]
      max_iter: 500

gap:
  K: 500
  n_inst: 500
  n_boot: 2000

recourse:
  threshold: 0.5
  nu: 0.05
  n_max: 0        # 0 = all TN individuals
  n_boot: 1000
  sweep_n_max: 250
  mediators:
    SCHL_GRP:
      display: "$\\Delta\\mathrm{Edu}$"
      type: discrete
      actionable: monotone_up
    OCCP_GRP:
      display: "Occ.\\ change"
      type: discrete
      actionable: free
    WKHP:
      display: "$\\Delta\\mathrm{WKHP}$ (h/wk)"
      type: continuous
      actionable: monotone_up
      clip: [1.0, 60.0]
      step: 0.5

paths:
  tensors: outputs/data/acs_tensors.pt
  flows: outputs/flows/acs/flow_models.pt
  outcome_dir: outputs/outcome/acs
  gaps_dir: outputs/gaps
  recourse_dir: outputs/recourse
  figures_dir: figures/acs_income
