name: german

loader:
  module: data.german
  fn: load_german_credit
  kwargs:
    random_state: ${seed}
    cache_dir: data/german
    max_rows: null

split:
  test_size: 100
  stratify: false

sfm:
  sensitive: [SEX]
  confounders: [AGE, PURPOSE_0, PURPOSE_1, PURPOSE_2, PURPOSE_3, PURPOSE_4,
                PURPOSE_5, PURPOSE_6, PURPOSE_7, PURPOSE_8, PURPOSE_9]
  standardize_confounders: [AGE]
  mediators_disc: [CHECKING_GRP, SAVINGS_GRP, HOUSING_GRP]
  mediators_cont: [CREDIT_AMOUNT, DURATION]
  mediator_layers:
    # Coordinates within each block are jointly modeled but not causally ordered.
    - [CHECKING_GRP, SAVINGS_GRP, HOUSING_GRP]  # financial status S
    - [CREDIT_AMOUNT, DURATION]                 # repayment terms R
  outcome: GOOD_CREDIT
  estimand: all_sensitive_paths_through_financial_status

wc_clip: null

flow:
  artifact_version: german_credit_acsr_all_s_paths_v2
  continuous_family: spline
  condition_cont_on_disc: true
  reuse_tensors: true
  hidden_dim: 32
  n_layers: 2
  condition_cont_on_sensitive: false
  disc_within_block_autoregressive: true
  disc_autoregressive: true
  disc_embed_dim: 4
  embed_dim: 4
  hidden_features: 32
  n_flow_layers: 2
  n_blocks: 2
  num_bins: 8
  tail_bound: 3.0
  batch_size: 64
  max_epochs: 200
  lr: 0.001
  patience: 20
  checkpoint_selection:
    posterior_predictive: true
    samples_per_context: 32
    max_rows: 100
    min_group_rows: 15
    ordered_mediators: [SAVINGS_GRP]
    max_overall_marginal_tv: 0.18
    max_group_marginal_tv: 0.30
    max_ordered_wasserstein: 0.18
    max_overall_continuous_w1: 0.35
    max_group_continuous_w1: 0.55
    max_continuous_correlation_error: 0.35
    score_weight: 2.0

outcome:
  # [SEX | AGE,PURPOSE(one-hot) | CHECKING,SAVINGS,HOUSING | AMOUNT,DURATION]
  col_types:
    X: [passthrough]
    Z: [scale, passthrough, passthrough, passthrough, passthrough, passthrough,
        passthrough, passthrough, passthrough, passthrough, passthrough]
    Wd: [ohe, ohe, ohe]
    Wc: [scale, scale]
  models:
    - name: "Logistic Reg."
      type: logreg
      C: 1.0
      max_iter: 1000
    - name: "Random Forest"
      type: random_forest
      n_estimators: 500
      max_depth: 6
      min_samples_leaf: 8
      max_features: sqrt
      class_weight: balanced
      n_jobs: -1

gap:
  K: 500
  n_inst: 100
  n_boot: 2000

recourse:
  propagate_descendants: true
  intervention_K: 64
  same_level_semantics: preserve_factual
  threshold: 0.5
  nu: 0.05
  eta: 10.0
  lambda_invariance: 0.0
  rho_anchor: 0.0
  disadvantaged_value: 0
  advantaged_value: 1
  reference_K: 500
  eta_grid: [0.0, 1.0, 3.0, 10.0, 30.0]
  lambda_grid: [0.0, 0.5, 1.0, 2.0, 5.0]
  rho_grid: [0.0, 0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
  constrained_recourse:
    enabled: true
    # Require at least 80% of propagated prediction draws to be favorable.
    min_success_probability: 0.8
    # Prediction-scale W1 radius around W|X=advantaged,Z_recipient.
    max_outcome_wasserstein: 0.1
  n_max: 0
  n_boot: 1000
  sweep_n_max: 0
  mediators:
    CHECKING_GRP:
      display: "Checking change"
      type: discrete
      actionable: free
    SAVINGS_GRP:
      display: "$\\Delta\\mathrm{Savings}$"
      type: discrete
      actionable: monotone_up
    HOUSING_GRP:
      display: "Housing change"
      type: discrete
      actionable: fixed
    CREDIT_AMOUNT:
      display: "$\\Delta\\mathrm{CreditAmount}$"
      type: continuous
      actionable: monotone_down
      clip: [250, 18424]
      step: 2000
    DURATION:
      display: "$\\Delta\\mathrm{Duration}$"
      type: continuous
      actionable: monotone_down
      clip: [4, 72]
      step: 12

paths:
  tensors: outputs/data/german_tensors.pt
  flows: outputs/flows/german/flow_models.pt
  outcome_dir: outputs/outcome/german
  gaps_dir: outputs/gaps
  recourse_dir: outputs/recourse
  figures_dir: figures/german_credit
